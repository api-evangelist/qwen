apis:
- aid: qwen:dashscope
  name: DashScope (Alibaba Cloud Model Studio) API
  description: >-
    Native Alibaba Cloud Model Studio API serving the Qwen model family. Provides chat completions, multimodal
    vision, embeddings, audio (TTS/ASR), image generation, video generation, function calling, and tool
    use. Both DashScope-native and OpenAI-compatible endpoints. Multiple regional base URLs (Singapore,
    US-Virginia, HK, Frankfurt, Beijing).
